[project]
name = "sherlock-backend"
version = "0.1.0"
description = "Sherlock backend: API, worker, and pipeline services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "fastembed>=0.8",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "readability-lxml>=0.9",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fakeredis[lua]>=2.39.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = [
    "S311",  # random is fine for jitter
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF001", "ASYNC240", "E501"]  # test data has long literals
"tests/fixtures/**" = ["E501", "S603", "S607"]  # fixture build scripts: long literal text, run typst

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*", "readability.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
